<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research — Rohit Dilip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.5;
            color: #000;
            background: #fefcfb;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* --- Header & Nav --- */
        header {
            border-bottom: 1px solid #f0ede9;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
        }

        .logo {
            font-size: 1rem;
            font-weight: 500;
            color: #000;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.2s;
            letter-spacing: -0.01em;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #000;
        }

        /* --- Section --- */
        .section {
            padding: 2rem 0;
        }

        .section h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 1.2rem;
            letter-spacing: -0.01em;
        }

        /* --- Research listing cards --- */
        .research-cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .research-card {
            display: block;
            text-decoration: none;
            padding: 1.2rem 1.4rem;
            border: 1px solid #f0ede9;
            border-radius: 8px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .research-card:hover {
            border-color: #dbe3ff;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.06);
        }

        .research-card h3 {
            font-size: 1rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
        }

        .research-card-date {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.4rem;
        }

        .research-card-desc {
            font-size: 0.9rem;
            color: #000;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .research-card-link {
            font-size: 0.85rem;
            color: #2563eb;
            font-weight: 400;
        }

        .no-posts {
            color: #666;
            font-size: 0.9rem;
            font-style: italic;
        }

        /* --- Research post view --- */
        .back-link {
            display: inline-block;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .research-post-title {
            font-size: 1.6rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .research-post-date {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f0ede9;
        }

        /* --- Markdown content --- */
        .markdown-content {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #000;
            font-weight: 400;
        }

        .markdown-content .katex-display {
            margin: 1rem 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            color: #000;
            font-weight: 500;
            margin: 1.2rem 0 0.6rem 0;
            letter-spacing: -0.01em;
        }

        .markdown-content h1 {
            font-size: 1.2rem;
        }

        .markdown-content h2 {
            font-size: 1.1rem;
        }

        .markdown-content h3 {
            font-size: 1rem;
        }

        .markdown-content p {
            margin-bottom: 0.8rem;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 0.8rem 0;
            padding-left: 1.2rem;
        }

        .markdown-content li {
            margin-bottom: 0.2rem;
        }

        .markdown-content code {
            background: #f5f3f1;
            padding: 0.15rem 0.3rem;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.8em;
        }

        .markdown-content pre {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            overflow-x: auto;
            background: #f5f3f1;
            border: 1px solid #eee;
            margin: 1rem 0;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            border-radius: 6px;
        }

        .markdown-content blockquote {
            border-left: 2px solid #ddd;
            padding-left: 0.8rem;
            margin: 1rem 0;
            color: #000;
        }

        .markdown-content strong {
            font-weight: 500;
            color: #000;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 2.5rem 0;
        }

        .markdown-content a {
            color: #2563eb;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .markdown-content a:hover {
            color: #1d4ed8;
        }

        /* --- Images in research posts --- */
        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        .markdown-content p > img:only-child {
            display: block;
            margin: 1.5rem auto;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.85rem;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid #f0ede9;
            padding: 0.5rem 0.75rem;
            text-align: left;
        }

        .markdown-content th {
            background: #f8f6f4;
            font-weight: 500;
        }

        /* --- Footer --- */
        footer {
            border-top: 1px solid #f0ede9;
            padding: 1.5rem 0;
            margin-top: 1.5rem;
        }

        footer p {
            text-align: center;
            font-size: 0.8rem;
            color: #000;
            font-weight: 400;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 2rem 0;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .nav-links {
                gap: 1.2rem;
            }

            .section {
                padding: 1.5rem 0;
            }

            .research-post-title {
                font-size: 1.4rem;
            }

            .research-card {
                padding: 1rem 1.2rem;
            }
        }
    </style>
    <!-- Markdown parser + sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
    <!-- Research logic -->
    <script src="research.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Rohit Dilip</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="research.html" class="active">Research</a></li>
                    <li><a href="notes.html">Notes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Listing view -->
    <div id="research-listing">
        <section class="section">
            <div class="container">
                <h2>Research</h2>
                <div id="research-cards" class="research-cards">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Individual post view -->
    <div id="research-post" style="display: none;">
        <section class="section">
            <div class="container">
                <a href="research" class="back-link">&larr; Back to Research</a>
                <h1 id="research-post-title" class="research-post-title"></h1>
                <div id="research-post-date" class="research-post-date"></div>
                <div id="research-post-content" class="markdown-content"></div>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Rohit Dilip</p>
        </div>
    </footer>
</body>

</html>
