<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit Dilip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.5;
            color: #000;
            background: #fefcfb;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .post-title:hover {
            color: #2563eb;
        }

        .post-title button:hover span.triangle {
            transform: rotate(90deg);
        }


        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .post-title button {
            text-decoration: none;
        }

        .post-title button:hover {
            text-decoration: underline;
        }

        /* --- Blog post hover + expand aesthetic --- */

        /* Compact row: make the title button feel click-ready */
        .post-toggle {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.15rem 0;
            transition: color 0.2s ease, background 0.2s ease;
            border-radius: 6px;
        }

        /* Default text + arrow */
        .post-toggle span.triangle {
            color: #666;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        /* Hover feedback: soft blue tint + darker text */
        .post-toggle:hover {
            color: #1d4ed8;
            /* slightly deeper blue */
            background: rgba(37, 99, 235, 0.06);
        }

        .post-toggle:hover span.triangle {
            color: #2563eb;
            transform: translateX(2px);
        }

        /* Expanded state: blue accent + rotated triangle */
        .post-toggle[aria-expanded="true"] {
            color: #1e40af;
            /* deep blue */
            font-weight: 500;
        }

        .post-toggle[aria-expanded="true"] span.triangle {
            /* color: #2563eb; */
            transform: rotate(90deg);
        }



        header {
            border-bottom: 1px solid #f0ede9;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
        }

        .markdown-content .katex-display {
            margin: 1rem 0;
        }


        .logo {
            font-size: 1rem;
            font-weight: 500;
            color: #000;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            font-size: 0.9rem;
            font-weight: 400;
            transition: color 0.2s;
            letter-spacing: -0.01em;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #000;
        }

        .intro {
            padding: 1.5rem 0;
            border-bottom: 1px solid #f0ede9;
            background: #fff;
        }

        .intro-content {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .intro-text {
            flex: 1;
        }

        .intro h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
        }

        .intro .subtitle {
            font-size: 0.95rem;
            color: #000;
            margin-bottom: 0.8rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .intro .subtitle a {
            color: #2563eb;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .intro .subtitle a:hover {
            color: #1d4ed8;
        }

        .social-links {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .social-links a {
            color: #666;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .social-links a:hover {
            color: #000;
        }

        .social-links a.github:hover {
            color: #333;
        }

        .social-links a.linkedin:hover {
            color: #0077b5;
        }

        .social-links a.google-scholar:hover {
            color: #4285f4;
        }

        .social-links a.twitter:hover {
            color: #000;
        }

        .social-links a.email:hover {
            color: #ea4335;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f8f6f4;
            border: 1px solid #f0ede9;
            flex-shrink: 0;
            overflow: hidden;
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #666;
            font-weight: 400;
        }

        .section {
            padding: 2rem 0;
        }

        .section:not(:last-child) {
            border-bottom: 1px solid #f0ede9;
        }

        .section h2 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 1.2rem;
            letter-spacing: -0.01em;
        }

        .about {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #000;
            max-width: 650px;
            font-weight: 400;
        }

        .papers {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .markdown-content hr {
            border: none;
            /* removes the default line style */
            border-top: 1px solid #ddd;
            /* your preferred line */
            margin: 2.5rem 0;
            /* ← adds space above and below */
        }

        .markdown-content pre code {
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            border-radius: 6px;
        }

        .markdown-content pre {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            overflow-x: auto;
            background: #f5f3f1;
            border: 1px solid #eee;
        }


        .paper {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f8f6f4;
        }

        .paper:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .paper h3 {
            font-size: 0.95rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 0.3rem;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }

        .paper h3 a {
            color: #2563eb;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .paper h3 a:hover {
            color: #1d4ed8;
        }

        .paper .authors {
            font-size: 0.85rem;
            color: #000;
            margin-bottom: 0.2rem;
            font-weight: 400;
        }

        .paper .venue {
            font-size: 0.8rem;
            color: #000;
            margin-bottom: 0.6rem;
            font-weight: 400;
        }

        .paper .description {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #000;
            font-weight: 400;
        }

        .blog-posts {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .blog-post {
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f8f6f4;
        }

        .blog-post:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .blog-post h3 {
            font-size: 1rem;
            font-weight: 500;
            color: #000;
            margin-bottom: 0.2rem;
            letter-spacing: -0.01em;
        }

        .blog-post .date {
            font-size: 0.8rem;
            color: #000;
            margin-bottom: 0.8rem;
            font-weight: 400;
        }

        .markdown-content {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #000;
            font-weight: 400;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            color: #000;
            font-weight: 500;
            margin: 1.2rem 0 0.6rem 0;
            letter-spacing: -0.01em;
        }

        .markdown-content h1 {
            font-size: 1.2rem;
        }

        .markdown-content h2 {
            font-size: 1.1rem;
        }

        .markdown-content h3 {
            font-size: 1rem;
        }

        .markdown-content p {
            margin-bottom: 0.8rem;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 0.8rem 0;
            padding-left: 1.2rem;
        }

        .markdown-content li {
            margin-bottom: 0.2rem;
        }

        .markdown-content code {
            background: #f5f3f1;
            padding: 0.15rem 0.3rem;
            border-radius: 3px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.8em;
        }

        .markdown-content pre {
            background: #f5f3f1;
            padding: 0.8rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid #f0ede9;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
        }

        .markdown-content blockquote {
            border-left: 2px solid #ddd;
            padding-left: 0.8rem;
            margin: 1rem 0;
            color: #000;
        }

        .markdown-content strong {
            font-weight: 500;
            color: #000;
        }


        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 2rem 0;
        }

        footer {
            border-top: 1px solid #f0ede9;
            padding: 1.5rem 0;
            margin-top: 1.5rem;
        }

        footer p {
            text-align: center;
            font-size: 0.8rem;
            color: #000;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .nav-links {
                gap: 1.2rem;
            }

            .intro h1 {
                font-size: 1.4rem;
            }

            .intro-content {
                flex-direction: column;
                text-align: center;
                gap: 1.2rem;
            }

            .profile-photo {
                order: -1;
                width: 100px;
                height: 100px;
            }

            .section {
                padding: 1.5rem 0;
            }

            .social-links {
                gap: 0.6rem;
            }
        }

        .badge-row {
            display: flex;
            gap: 0.5rem;
            /* space between badges */
            margin: 0.5rem 0;
            /* space above/below the row */
        }

        .badge-row img {
            height: 20px;
            /* keep badges a consistent small size */
        }
    </style>
    <!-- Markdown parser + sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
    <!-- Your blog logic -->
    <script src="blog.js" defer></script>
    <!-- Highlight.js for code coloring -->
    <!-- Put this AFTER your <style> so it wins the cascade -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>




</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Rohit Dilip</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="research.html">Research</a></li>
                    <li><a href="notes.html" class="active">Notes</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <div id="blog">
        <section class="section">
            <div class="container">
                <h2>Research Notes</h2>
                <div id="blog-posts" class="blog-posts">
                    <div class="loading">Loading posts...</div>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Rohit Dilip</p>
        </div>
    </footer>


</body>

</html>
