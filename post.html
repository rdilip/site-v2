  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    .post-content details {
      margin: 1.5rem 0;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border, #e8e5e1);
      border-radius: 8px;
      background: var(--surface, #f5f3f0);
      transition: background 0.2s ease;
    }
    .post-content details[open] {
      background: var(--background, #fff);
      padding-bottom: 1rem;
    }
    .post-content details > summary {
      cursor: pointer;
      font-weight: 600;
      font-family: var(--font-heading, Georgia, serif);
      color: var(--text, #1d1d1f);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
      outline: none;
    }
    .post-content details > summary::-webkit-details-marker { display: none; }
    .post-content details > summary::before {
      content: "▸";
      display: inline-block;
      font-size: 0.8em;
      color: var(--text-muted, #86868b);
      transition: transform 0.2s ease;
    }
    .post-content details[open] > summary::before { transform: rotate(90deg); }
    .post-content details > summary:hover { color: var(--accent, #2563eb); }
    .post-content details > *:not(summary) { margin-top: 0.75rem; }
    .post-content details > *:last-child { margin-bottom: 0; }

    .post-content .tip {
      position: relative;
      border-bottom: 1px dotted var(--text-muted, #86868b);
      cursor: help;
    }
    .post-content .tip-body {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%) translateY(4px);
      background: #fff;
      color: var(--text, #1d1d1f);
      font-family: var(--font-body, system-ui, sans-serif);
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.55;
      text-align: left;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border, #e8e5e1);
      border-radius: 10px;
      width: max-content;
      max-width: 360px;
      white-space: normal;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 10;
    }
    .post-content .tip-body::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: #fff;
      filter: drop-shadow(0 1px 0 var(--border, #e8e5e1));
    }
    .post-content .tip-body > *:first-child { margin-top: 0; }
    .post-content .tip-body > *:last-child { margin-bottom: 0; }
    .post-content .tip-body p { margin: 0.5rem 0; }
    .post-content .tip:hover .tip-body,
    .post-content .tip:focus .tip-body,
    .post-content .tip-body:hover {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .post-content .summary,
    .post-content :not(details) > summary {
      display: block;
      margin: 2.5rem 0;
      padding: 1.5rem 1.75rem;
      background: var(--surface, #f5f3f0);
      border: 1px solid var(--border, #e8e5e1);
      border-left: 4px solid var(--accent, #2563eb);
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      font-weight: 400;
      font-family: inherit;
      cursor: auto;
      list-style: none;
    }
    .post-content .summary::before,
    .post-content :not(details) > summary::before {
      content: "Summary";
      display: block;
      font-family: var(--font-heading, Georgia, serif);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent, #2563eb);
      margin-bottom: 0.75rem;
    }
    .post-content .summary > *:first-child,
    .post-content :not(details) > summary > *:first-child { margin-top: 0; }
    .post-content .summary > *:last-child,
    .post-content :not(details) > summary > *:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <div class="logo"><a href="index.html">Rohit Dilip</a></div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="research.html">Research</a></li>
          <li><a href="notes.html" class="active">Scales</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container container--wide">
      <div class="post-header">
        <a href="notes.html" class="post-back">&larr; Scales</a>
        <h1 class="post-title" id="post-title"></h1>
        <div class="post-date" id="post-date"></div>
      </div>
      <article class="post-content" id="post-content"></article>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Rohit Dilip</p>
    </div>
  </footer>

  <script>
    function parseFrontMatter(md) {
      const fm = md.match(/^---\s*([\s\S]*?)\s*---\s*\n?/);
      if (!fm) return { meta: {}, body: md };
      const meta = {};
      fm[1].split('\n').forEach(line => {
        const m = line.match(/^\s*([A-Za-z0-9_-]+)\s*:\s*(.*)\s*$/);
        if (m) meta[m[1].trim()] = m[2].trim();
      });
      return { meta, body: md.slice(fm[0].length) };
    }

    function extractBlockMath(md) {
      const blocks = [];
      let i = 0;
      md = md.replace(/(^|[^\\])\$\$([\s\S]+?)\$\$/g, (m, pre, body) => {
        const key = `⟪KXBLOCK:${i++}⟫`;
        blocks.push({ key, tex: body.trim() });
        return pre + key;
      });
      md = md.replace(
        /\\begin\{(align\*?|aligned|gather\*?|equation\*?|multline\*?)\}([\s\S]+?)\\end\{\1\}/g,
        (m, env, body) => {
          const key = `⟪KXBLOCK:${i++}⟫`;
          blocks.push({ key, tex: `\\begin{${env}}${body}\\end{${env}}` });
          return key;
        }
      );
      return { mdWithoutBlocks: md, blocks };
    }

    function hydrateBlockMath(el, blocks) {
      if (!blocks.length) return;
      let html = el.innerHTML;
      for (const { key, tex } of blocks) {
        html = html.split(key).join(
          `<span class="katex-mount" data-math="${encodeURIComponent(tex)}"></span>`
        );
      }
      el.innerHTML = html;
      el.querySelectorAll('.katex-mount').forEach(m => {
        const tex = decodeURIComponent(m.getAttribute('data-math') || '');
        try { katex.render(tex, m, { displayMode: true, throwOnError: false }); }
        catch (e) { m.textContent = tex; }
      });
    }

    function renderInlineMath(el) {
      if (typeof renderMathInElement !== 'function') return;
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true },
        ],
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        throwOnError: false,
      });
    }

    async function loadPost() {
      const params = new URLSearchParams(location.search);
      const slug = params.get('p');
      const titleEl = document.getElementById('post-title');
      const dateEl = document.getElementById('post-date');
      const contentEl = document.getElementById('post-content');

      if (!slug || !/^[A-Za-z0-9_-]+$/.test(slug)) {
        titleEl.textContent = 'Post not found';
        return;
      }

      try {
        const res = await fetch(`posts/${slug}.md`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        const { meta, body } = parseFrontMatter(md);

        const title = meta.title || slug;
        const date = meta.date || '';
        document.title = `${title} — Rohit Dilip`;
        titleEl.textContent = title;
        dateEl.textContent = date;
        if (!date) dateEl.style.display = 'none';

        const { mdWithoutBlocks, blocks } = extractBlockMath(body);
        marked.setOptions({ gfm: true, breaks: false, mangle: false, headerIds: false });
        contentEl.innerHTML = DOMPurify.sanitize(marked.parse(mdWithoutBlocks));

        if (window.hljs) {
          contentEl.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
          });
        }

        hydrateBlockMath(contentEl, blocks);
        renderInlineMath(contentEl);
      } catch (err) {
        titleEl.textContent = 'Post not found';
        contentEl.innerHTML = `<p>Could not load <code>${slug}</code>: ${err.message}</p>`;
      }
    }

    loadPost();
  </script>
</body>
</html>
